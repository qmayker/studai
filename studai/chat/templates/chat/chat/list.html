{% extends 'base.html' %}

{% block title %}Chat List{% endblock title %}

{% block content %}
<div class="chat-list">
<h2>Chat List</h2>
    <ul>
        {% for chat in object_list %}
            <li><a href="{{chat.get_absolute_url}}">{{ chat.chat_name }}</a></li>
        {% empty %}
            <li>No chats available.</li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
