<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    {% block title %}{% endblock title %}
    </title>
</head>
<body>
    <h1>StudAI</h1>
    <p>Study easy with StudAI! Your personal study assistant.</p>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}
    {% endblock content %}
</body>
<script src="
    https://cdn.jsdelivr.net/npm/js-cookie@3.0.7/dist/js.cookie.min.js
"></script>
 {% block scripts %}
 {% endblock scripts %}
</html>
